<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕时间漂移校正</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="wrap">
  <h1>字幕时间漂移校正</h1>
  <p class="sub">粘贴 SRT 字幕与多组人工确认的「原时间 / 正确时间」锚点，系统按相邻锚点做分段线性映射，锚点外沿用最近区段斜率。</p>
  <p class="nav"><a href="/placement">字幕位置规划（按画面遮挡选择上/下方并导出 WebVTT）→</a></p>

  <div class="card">
    <label for="srt">原始 SRT 字幕</label>
    <textarea id="srt" placeholder="1&#10;00:00:05,000 --> 00:00:08,000&#10;第一句字幕&#10;&#10;2&#10;00:00:12,000 --> 00:00:15,500&#10;第二句字幕"></textarea>
  </div>

  <div class="card">
    <h2>时间锚点
      <span class="hint">至少 2 组，原时间与正确时间都必须严格递增；时间格式 HH:MM:SS,mmm（毫秒分隔符逗号或句点均可）</span>
    </h2>
    <table class="anchors">
      <thead>
        <tr>
          <th style="width:44%">原时间（字幕上的时间）</th>
          <th style="width:44%">正确时间（人工确认）</th>
          <th style="width:40px"></th>
          <th style="width:44px"></th>
        </tr>
      </thead>
      <tbody id="anchorRows"></tbody>
    </table>
    <div class="toolbar">
      <button type="button" id="addAnchor">+ 添加锚点</button>
      <button type="button" id="fillExample">填入示例</button>
    </div>
  </div>

  <div id="errorBox" class="alert error hidden"></div>
  <div id="warnBox" class="alert warn hidden"></div>

  <div class="toolbar" style="margin-bottom: 20px;">
    <button type="button" class="primary" id="submit">校正时间</button>
    <span class="hint" id="status"></span>
  </div>

  <div id="resultCard" class="card hidden">
    <h2>校正结果</h2>
    <div id="okBox" class="alert ok hidden"></div>
    <div class="toolbar" style="margin-top:0;">
      <button type="button" class="primary" id="download">下载 corrected.srt</button>
    </div>
    <table class="cues">
      <thead>
        <tr>
          <th>#</th>
          <th>原时间轴</th>
          <th></th>
          <th>校正后时间轴</th>
          <th>文本</th>
        </tr>
      </thead>
      <tbody id="cueTable"></tbody>
    </table>
    <h2 style="margin-top:18px;">SRT 预览</h2>
    <pre class="preview" id="preview"></pre>
  </div>
</div>

<script>
(function () {
  const rowsEl = document.getElementById("anchorRows");
  const srtEl = document.getElementById("srt");
  const errorBox = document.getElementById("errorBox");
  const warnBox = document.getElementById("warnBox");
  const resultCard = document.getElementById("resultCard");
  const previewEl = document.getElementById("preview");
  const cueTableEl = document.getElementById("cueTable");
  const okBox = document.getElementById("okBox");
  const statusEl = document.getElementById("status");

  function addRow(original, corrected) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td class="time"><input type="text" class="orig" placeholder="00:01:00,000" spellcheck="false"></td>' +
      '<td class="time"><input type="text" class="corr" placeholder="00:00:58,200" spellcheck="false"></td>' +
      '<td class="op">→</td>' +
      '<td class="del"><button type="button" class="danger-link" title="删除该锚点">删除</button></td>';
    tr.querySelector(".orig").value = original || "";
    tr.querySelector(".corr").value = corrected || "";
    tr.querySelector(".danger-link").addEventListener("click", () => {
      if (rowsEl.children.length > 2) tr.remove();
      else alert("至少需要保留 2 组锚点。");
    });
    rowsEl.appendChild(tr);
  }

  function collectAnchors() {
    const anchors = [];
    for (const tr of rowsEl.querySelectorAll("tr")) {
      anchors.push({
        original: tr.querySelector(".orig").value.trim(),
        corrected: tr.querySelector(".corr").value.trim()
      });
    }
    return anchors;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove("hidden");
  }
  function clearAlerts() {
    errorBox.classList.add("hidden");
    warnBox.classList.add("hidden");
    okBox.classList.add("hidden");
    errorBox.textContent = "";
    warnBox.textContent = "";
    okBox.textContent = "";
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // 初始两组空锚点
  addRow();
  addRow();

  document.getElementById("addAnchor").addEventListener("click", () => addRow());

  const EXAMPLE_SRT =
    "1\n00:00:10,000 --> 00:00:13,000\n大家好，欢迎收看本期节目\n\n" +
    "2\n00:00:18,500 --> 00:00:21,800\n今天我们来聊聊时间漂移\n\n" +
    "3\n00:01:05,000 --> 00:01:09,200\n字幕越往后，偏差越大\n\n" +
    "4\n00:02:40,000 --> 00:02:44,500\n这就是典型的线性漂移\n\n" +
    "5\n00:05:00,000 --> 00:05:04,000\n用两组以上锚点即可分段校正\n";

  document.getElementById("fillExample").addEventListener("click", () => {
    srtEl.value = EXAMPLE_SRT;
    rowsEl.innerHTML = "";
    addRow("00:00:10,000", "00:00:08,000");
    addRow("00:02:40,000", "00:02:35,000");
    addRow("00:05:00,000", "00:04:52,000");
    clearAlerts();
    resultCard.classList.add("hidden");
  });

  document.getElementById("submit").addEventListener("click", async () => {
    clearAlerts();
    resultCard.classList.add("hidden");
    statusEl.textContent = "校正中…";

    const anchors = collectAnchors();
    try {
      const resp = await fetch("/api/correct", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ srt: srtEl.value, anchors })
      });
      const data = await resp.json();
      if (!resp.ok) {
        showError((data.detail && data.detail.message) || ("请求失败（HTTP " + resp.status + "）"));
        statusEl.textContent = "";
        return;
      }

      // 页面预览与下载共用同一份服务器返回的 corrected_srt
      window.__correctedSrt = data.corrected_srt;
      previewEl.textContent = window.__correctedSrt;
      cueTableEl.innerHTML = data.cues.map(c =>
        "<tr>" +
        '<td class="num">' + escapeHtml(c.index) + "</td>" +
        '<td class="tc">' + escapeHtml(c.original_start) + "<br>" + escapeHtml(c.original_end) + "</td>" +
        '<td class="arrow">→</td>' +
        '<td class="tc">' + escapeHtml(c.corrected_start) + "<br>" + escapeHtml(c.corrected_end) + "</td>" +
        "<td>" + escapeHtml(c.text).replace(/\n/g, "<br>") + "</td>" +
        "</tr>"
      ).join("");

      if (data.warnings && data.warnings.length) {
        warnBox.textContent = data.warnings.join("\n");
        warnBox.classList.remove("hidden");
      } else {
        okBox.textContent = "共校正 " + data.cues.length + " 条字幕，未发现异常。";
        okBox.classList.remove("hidden");
      }
      resultCard.classList.remove("hidden");
      statusEl.textContent = "";
    } catch (err) {
      showError("请求出错：" + err);
      statusEl.textContent = "";
    }
  });

  document.getElementById("download").addEventListener("click", () => {
    // 预览与下载使用同一份服务器返回：服务端仅替换时间码，
    // 原文件带 BOM 时保留唯一一个 BOM，这里不再额外添加，避免重复。
    const content = window.__correctedSrt || "";
    const blob = new Blob([content], { type: "application/x-subrip;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "corrected.srt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
